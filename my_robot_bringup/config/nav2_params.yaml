bt_navigator:
  ros__parameters:
    robot_base_frame: base_footprint
    odom_topic: /odom
    default_server_timeout: 1000
controller_server:
  ros__parameters:
    min_x_velocity_threshold: 0.06
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.02
    failure_tolerance: 0.3
    goal_checker_plugins: ["general_goal_checker"]
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05 # check gool 0.05 m2
      yaw_goal_tolerance: 0.1 # check goal 0.1 rad
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.07 # van toc mong muon cua robot
      approach_velocity_scaling_dist: 0.25
      lookahead_dist: 0.25
      min_lookahead_dist: 0.18
      max_lookahead_dist: 0.35
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 0.25
      max_angular_accel: 1.0
      rotate_to_heading_min_angle: 0.6
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      # regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.05
      max_allowed_time_to_collision_up_to_carrot: 1.5
      transform_tolerance: 1.0
      # cost_scaling_dist: 0.3
local_costmap:
  local_costmap:
    ros__parameters:
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true # local costmap di chuyen theo robot
      width: 4 
      height: 4
      resolution: 0.05 # độ phân giải của map 
      footprint: "[[-0.180, 0.14], [-0.180, -0.14], [0.045, -0.14], [0.045, 0.14]]" # vùng robot biết chiếm trên map
      footprint_padding: 0.02 # vùng đệm từ viền robot
      transform_tolerance: 1.0 # thời gian chờ để nhận dữ liệu từ các cảm biến
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          clearing: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.5 # vùng đệm từ viền vật cản
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      robot_base_frame: base_footprint
      footprint: "[[-0.180, 0.14], [-0.180, -0.14], [0.045, -0.14], [0.045, 0.14]]"
      footprint_padding: 0.02
      resolution: 0.05
      transform_tolerance: 1.0
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map
        subscribe_to_updates: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.5
      always_send_full_costmap: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      use_astar: true # dung thuat toan A* de tim duong di ngan nhat
      # allow_unknown: true
behavior_server:
  ros__parameters:
    robot_base_frame: base_footprint
    transform_tolerance: 1.0
    max_rotational_vel: 0.4
    min_rotational_vel: 0.2
    rotational_acc_lim: 0.6
velocity_smoother:
  ros__parameters:
    max_velocity: [0.08, 0.0, 0.4] # tốc độ tối đa
    min_velocity: [-0.06, 0.0, -0.4] # tốc độ tối thiểu 
    max_accel: [0.2, 0.0, 0.6]
    max_decel: [-0.2, 0.0, -0.6]
